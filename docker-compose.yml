services:
  api:
    build: .
    image: novel-ai-trans:local
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "${API_PORT:-8000}"
      API_SECRET_KEY: "${API_SECRET_KEY:?Set API_SECRET_KEY in .env before running Docker Compose}"
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - ./translated:/app/translated
      - ./runtime:/app/runtime
      - ./configs:/app/configs
      - ./.env:/app/.env
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # Uncomment on hosts with NVIDIA Container Toolkit installed.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama:
