[project]
name = "novel-ai-trans"
version = "0.1.0"
description = "End-to-end pipeline for crawling, translating, and packaging public-domain novels with LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{name = "Tuan Nguyen"}]
keywords = [
    "crawler", "translation", "novel", "lightnovel", "webnovel",
    "llm", "ollama", "gemini", "openrouter",
    "chinese", "korean", "japanese", "vietnamese", "english",
    "epub", "langgraph",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.138.1",
    "httpx2>=2.0.0",
    "langchain-core>=1.3.3",
    "langgraph>=1.1.10",
    "playwright>=1.49.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.4.5",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
crawl     = "src.cli.crawl.crawler:main"
generate  = "src.cli.crawl.generator:main"
validate  = "src.cli.crawl.validator:main"
import    = "src.cli.crawl.importer:main"
insert    = "src.cli.insertion:main"
translate = "src.cli.translate:main"
pack      = "src.cli.pack:main"
glossary  = "src.cli.glossary:main"
test      = "src.cli.test:main"
build     = "src.cli.build:main"
serve     = "src.api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
